  <g transform="translate(815 302)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="300" height="72" rx="18" fill="#071426" stroke="#0EA5E9" stroke-opacity="0.45"/>
    <text x="22" y="30" fill="#7DD3FC" font-size="13" font-weight="700">OBJETIVO</text>
    <text x="22" y="53" fill="#FFFFFF" font-size="17" font-weight="700">Construir projetos reais para TI</text>
