    <rect x="18" y="48" width="80" height="7" rx="3.5" fill="#FFFFFF"/>
    <rect x="18" y="57" width="80" height="7" rx="3.5" fill="#CF2027"/>
    <rect x="18" y="66" width="80" height="7" rx="3.5" fill="#FFFFFF"/>
    <g fill="#F7D116">
      <circle cx="58" cy="20" r="3.2"/><circle cx="80" cy="28" r="3.2"/><circle cx="92" cy="48" r="3.2"/><circle cx="92" cy="70" r="3.2"/><circle cx="80" cy="88" r="3.2"/>
      <circle cx="58" cy="96" r="3.2"/><circle cx="36" cy="88" r="3.2"/><circle cx="24" cy="70" r="3.2"/><circle cx="24" cy="48" r="3.2"/><circle cx="36" cy="28" r="3.2"/>
    </g>
  </g>

  <text x="170" y="78" fill="#94A3B8" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">CLÁUDIO TAVARES</text>
  <text x="170" y="126" fill="#FFFFFF" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="800">Engenharia de Sistemas e Informática</text>
  <text x="170" y="158" fill="#7DD3FC" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">3.º ano • Profissional no Banco de Cabo Verde • Em transição para TI</text>

  <line x1="50" y1="190" x2="1150" y2="190" stroke="url(#cyan)" stroke-width="2">
