    <text x="22" y="30" fill="#C4B5FD" font-size="13" font-weight="700">EM EVOLUÇÃO</text>
    <text x="22" y="53" fill="#FFFFFF" font-size="17" font-weight="700">Software • BI • IA • Python</text>
