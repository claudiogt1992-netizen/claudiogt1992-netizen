<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Perfil profissional de Cláudio Tavares">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#071A34"/>
      <stop offset="100%" stop-color="#03111F"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="105" cy="90" r="105" fill="url(#glow)"><animate attributeName="r" values="92;112;92" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="70" r="90" fill="url(#glow)" opacity="0.75"><animate attributeName="r" values="76;98;76" dur="6s" repeatCount="indefinite"/></circle>

  <g opacity="0.32" stroke="#38BDF8" stroke-width="1">
    <path d="M0 65 H270 L305 100 H470"/>
    <path d="M1200 120 H970 L935 155 H760"/>
    <path d="M0 350 H240 L275 315 H420"/>
    <path d="M1200 330 H1020 L985 295 H830"/>
  </g>

  <g transform="translate(48 42)" filter="url(#softGlow)">
