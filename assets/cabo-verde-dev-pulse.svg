    <g transform="translate(565 225)"><rect width="185" height="42" rx="21" fill="#0F172A" stroke="#F7D116" stroke-opacity="0.65"/><circle cx="20" cy="21" r="6" fill="#F7D116"><animate attributeName="opacity" values="1;0.45;1" dur="2.8s" repeatCount="indefinite"/></circle><text x="36" y="27" fill="#E2E8F0">Segurança</text></g>
    <g transform="translate(765 225)"><rect width="145" height="42" rx="21" fill="#0F172A" stroke="#22C55E" stroke-opacity="0.6"/><circle cx="20" cy="21" r="6" fill="#22C55E"/><text x="36" y="27" fill="#E2E8F0">Python</text></g>
    <g transform="translate(925 225)"><rect width="190" height="42" rx="21" fill="#0F172A" stroke="#F97316" stroke-opacity="0.6"/><circle cx="20" cy="21" r="6" fill="#F97316"/><text x="36" y="27" fill="#E2E8F0">Dados &amp; Cloud</text></g>
