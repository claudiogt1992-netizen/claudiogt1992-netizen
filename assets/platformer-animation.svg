<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-label="Jornada de transição para Tecnologias de Informação">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#020617"/><stop offset="55%" stop-color="#061A35"/><stop offset="100%" stop-color="#020617"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00AEEF" stop-opacity="0.35"/><stop offset="100%" stop-color="#003893" stop-opacity="0.15"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1000" height="190" rx="24" fill="url(#bg)"/>
  <text x="50" y="45" fill="#FFFFFF" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">Minha jornada em TI</text>
  <text x="50" y="74" fill="#A9CFFF" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Linux • Redes • Segurança • Python • Dados • Cloud</text>

  <g filter="url(#glow)">
    <polygon points="870,27 876,42 892,42 879,51 884,67 870,57 856,67 861,51 848,42 864,42" fill="#F7D116"><animateTransform attributeName="transform" type="rotate" values="0 870 48;360 870 48" dur="7s" repeatCount="indefinite"/></polygon>
    <circle cx="930" cy="54" r="7" fill="#38BDF8"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.3s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="0" y="138" width="1000" height="8" fill="#00AEEF" opacity="0.25"/>
  <rect x="0" y="146" width="1000" height="44" fill="#020617" opacity="0.78"/>
  <path d="M0 138 C120 120,240 153,360 138 C480 123,600 153,720 138 C840 122,930 148,1000 135 L1000 190 L0 190 Z" fill="url(#floor)"><animateTransform attributeName="transform" type="translate" values="-12 0;12 0;-12 0" dur="8s" repeatCount="indefinite"/></path>

  <g font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" filter="url(#glow)">
    <g transform="translate(415 108)"><rect width="58" height="28" rx="7" fill="#2563EB"/><text x="29" y="18" text-anchor="middle" fill="#fff">LINUX</text></g>
    <g transform="translate(500 108)"><rect width="58" height="28" rx="7" fill="#7C3AED"/><text x="29" y="18" text-anchor="middle" fill="#fff">REDES</text></g>
    <g transform="translate(585 108)"><rect width="58" height="28" rx="7" fill="#F59E0B"/><text x="29" y="18" text-anchor="middle" fill="#fff">SEC</text></g>
    <g transform="translate(670 108)"><rect width="58" height="28" rx="7" fill="#16A34A"/><text x="29" y="18" text-anchor="middle" fill="#fff">PY</text></g>
    <g transform="translate(755 108)"><rect width="58" height="28" rx="7" fill="#0EA5E9"/><text x="29" y="18" text-anchor="middle" fill="#fff">DATA</text></g>
  </g>

  <g filter="url(#glow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="70 0;300 0;520 0;760 0;70 0" dur="9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0;0 -17;0 0" dur="0.9s" repeatCount="indefinite"/>
      <rect x="7" y="126" width="9" height="21" rx="4" fill="#FFFFFF"/><rect x="25" y="126" width="9" height="21" rx="4" fill="#FFFFFF"/>
      <rect x="2" y="144" width="16" height="6" rx="3" fill="#00AEEF"/><rect x="22" y="144" width="16" height="6" rx="3" fill="#00AEEF"/>
      <rect x="2" y="94" width="38" height="36" rx="9" fill="#00AEEF"/><rect x="9" y="100" width="24" height="26" rx="6" fill="#003893" opacity="0.55"/>
      <circle cx="21" cy="78" r="17" fill="#FFD7A1"/><path d="M4 75 C8 57,33 57,38 75 Z" fill="#003893"/><rect x="28" y="71" width="22" height="6" rx="3" fill="#003893"/>
      <circle cx="15" cy="79" r="2" fill="#061A35"/><circle cx="26" cy="79" r="2" fill="#061A35"/><path d="M16 87 C20 90,24 90,28 87" fill="none" stroke="#061A35" stroke-width="2" stroke-linecap="round"/>
      <rect x="-8" y="99" width="11" height="24" rx="6" fill="#FFD7A1"/><rect x="39" y="99" width="11" height="24" rx="6" fill="#FFD7A1"/>
      <rect x="9" y="106" width="24" height="13" rx="4" fill="#020617" opacity="0.85"/><text x="21" y="116" text-anchor="middle" fill="#F7D116" font-family="Arial" font-size="9" font-weight="800">TI</text>
    </g>
  </g>

  <g fill="#38BDF8"><circle cx="210" cy="116" r="3"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></circle><circle cx="320" cy="106" r="2.5"><animate attributeName="opacity" values="1;0;1" dur="2.5s" repeatCount="indefinite"/></circle><circle cx="910" cy="112" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle></g>
</svg>
